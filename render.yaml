services:
  - type: web
    name: advensure-api-varietyboi
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm ci --include=dev && npm run prisma:generate --workspace apps/api && npm run build --workspace apps/api
    startCommand: npm run prisma:push --workspace apps/api && npm run start --workspace apps/api
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: advensure-db-varietyboi
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        value: https://advensure-web-varietyboi.onrender.com

  - type: web
    name: advensure-web-varietyboi
    runtime: static
    rootDir: .
    buildCommand: npm ci --include=dev && npm run build --workspace apps/web
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://advensure-api-varietyboi.onrender.com

databases:
  - name: advensure-db-varietyboi
    plan: free
    region: oregon
